name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # npm'i güncelle (OIDC / Trusted Publishing desteği için)
      - name: Update npm
        run: npm install -g npm@latest

      - name: Show versions
        run: |
          node -v
          npm -v

      - run: npm install --ignore-scripts

      - run: npm run build

      - run: npm publish --provenance --access public