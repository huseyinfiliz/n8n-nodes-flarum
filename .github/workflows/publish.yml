name: Publish to npm

# Trigger by pushing a version tag, e.g.:
#   git tag v0.2.0
#   git push origin v0.2.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --ignore-scripts

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          # Only needed if you did NOT set up a Trusted Publisher on npmjs.com.
          # With a Trusted Publisher configured, this line can be removed —
          # npm authenticates via OIDC using the id-token permission above.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
